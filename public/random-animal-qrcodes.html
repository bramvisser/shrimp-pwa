<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Shrimp PWA — Random Animal ID QR codes</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 24px;
      color: #111;
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.subtitle { color: #555; margin: 0 0 20px; font-size: 13px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      background: #fff;
      page-break-inside: avoid;
    }
    .card .qr { display: flex; justify-content: center; }
    .card .qr img { width: 160px; height: 160px; image-rendering: pixelated; }
    .label {
      margin-top: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .sub { color: #888; font-size: 11px; margin-top: 2px; }
    @media print {
      body { margin: 12mm; }
      .no-print { display: none; }
    }
    .actions { margin-bottom: 18px; }
    button {
      padding: 6px 12px;
      border: 1px solid #888;
      background: #f6f6f6;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1>Random Animal ID QR codes</h1>
  <p class="subtitle">Format <code>A&lt;n&gt;</code> — matches the simulator's founder/animal ID convention. Scan with the Measurement screen.</p>
  <div class="actions no-print">
    <button onclick="window.print()">Print</button>
    <button onclick="regenerate()">Regenerate</button>
  </div>
  <div id="grid" class="grid"></div>

  <script>
    function sampleIds(count) {
      // Mix realistic-looking IDs: founders (low n) and later generations (higher n).
      const ids = new Set();
      // A few founder-range
      while (ids.size < Math.min(4, count)) {
        ids.add('A' + (1 + Math.floor(Math.random() * 60)));
      }
      // Spread across larger n
      while (ids.size < count) {
        ids.add('A' + (60 + Math.floor(Math.random() * 9000)));
      }
      return [...ids];
    }

    function qrDataUrl(text) {
      const qr = qrcode(0, 'M');
      qr.addData(text);
      qr.make();
      // 4px per module, 4-module margin
      return qr.createDataURL(4, 4);
    }

    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      const ids = sampleIds(12);
      for (const id of ids) {
        const card = document.createElement('div');
        card.className = 'card';
        const qrWrap = document.createElement('div');
        qrWrap.className = 'qr';
        const img = document.createElement('img');
        img.src = qrDataUrl(id);
        img.alt = id;
        qrWrap.appendChild(img);
        const label = document.createElement('div');
        label.className = 'label';
        label.textContent = id;
        const sub = document.createElement('div');
        sub.className = 'sub';
        sub.textContent = 'animal ID';
        card.appendChild(qrWrap);
        card.appendChild(label);
        card.appendChild(sub);
        grid.appendChild(card);
      }
    }

    function regenerate() { render(); }
    render();
  </script>
</body>
</html>
